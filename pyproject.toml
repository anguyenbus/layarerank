[project]
name = "layareranker"
version = "0.1.0"
description = "Batched, token-aware document reranking on Laya decision models"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "laya==0.3.21",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "strands-decider==0.1.0",
]

[project.optional-dependencies]
# Exactly one torch flavour must be selected: `--extra cpu` for dev/CI, `--extra gpu` for images.
cpu = ["torch==2.14.0"]
gpu = ["torch==2.14.0"]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "prometheus-client>=0.20",
]
eval = [
    "bm25s>=0.2",
    "datasets>=3.0",
    "sentence-transformers>=3.0",
    "decider-ai==1.9.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

# decider-ai lists flash-linear-attention for its Qwen models; the Gemma checkpoint evaluated here does
# not use it, and installing it shifts Strands Decider's scores (fiqa-decider-2026-10-03.md, §4.5).
[[tool.uv.dependency-metadata]]
name = "decider-ai"
version = "1.9.0"
requires-dist = ["torch", "transformers>=5", "numpy", "huggingface_hub", "jinja2"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/layareranker"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "PT"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
# Each eval system imports its own heavy optional dependency only when selected.
"evals/*" = ["PLC0415"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["layareranker"]
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["laya", "laya.*", "torch", "torch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["model: needs the real Laya checkpoint (set HF_HOME); skipped unless -m model"]
addopts = "-m 'not model'"
